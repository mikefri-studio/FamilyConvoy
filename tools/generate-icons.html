<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur d'icônes Family Convoy</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0b0d10;color:#e8eaed;display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px}
  h1{font-size:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  button{background:linear-gradient(135deg,#4285f4,#1a73e8);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer}
  button:active{transform:scale(.96)}
  canvas{border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  p{color:#9aa0a6;font-size:13px;max-width:420px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<h1>🚗 Générateur d'icônes PNG</h1>
<canvas id="preview" width="192" height="192"></canvas>
<div class="row">
  <button data-size="192" data-name="icon-192.png">⬇ 192×192</button>
  <button data-size="512" data-name="icon-512.png">⬇ 512×512</button>
  <button data-size="512" data-name="icon-maskable-512.png" data-mask="1">⬇ 512 maskable</button>
  <button data-size="180" data-name="icon-180.png">⬇ 180 (Apple)</button>
</div>
<p>Enregistre les 4 fichiers dans le dossier <b>icons/</b> à la racine du dépôt, puis commit. Le manifest et index.html les référencent déjà.</p>
<script>
function draw(size, maskable){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const r = maskable ? 0 : size * 0.22;
  // fond dégradé
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#4285f4'); g.addColorStop(1, '#1a73e8');
  x.beginPath();
  if (r){ x.moveTo(r,0); x.arcTo(size,0,size,size,r); x.arcTo(size,size,0,size,r); x.arcTo(0,size,0,0,r); x.arcTo(0,0,size,0,r); }
  else x.rect(0,0,size,size);
  x.closePath(); x.fillStyle = g; x.fill();
  // halo route
  x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = size*0.045; x.lineCap='round';
  x.beginPath(); x.moveTo(size*0.22, size*0.80); x.quadraticCurveTo(size*0.5, size*0.62, size*0.78, size*0.80); x.stroke();
  // voiture
  const s = maskable ? 0.42 : 0.52;
  x.font = `${size*s}px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('🚗', size/2, size*(maskable?0.46:0.44));
  return c;
}
const prev = document.getElementById('preview');
prev.getContext('2d').drawImage(draw(192,false),0,0);
document.querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    const size = +b.dataset.size, mask = b.dataset.mask === '1';
    draw(size, mask).toBlob(blob=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = b.dataset.name;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  };
});
</script>
</body>
</html>
