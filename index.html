<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>Family Convoy 🚗</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Family Convoy","short_name":"Convoy","start_url":".","display":"standalone","background_color":"%231a73e8","theme_color":"%231a73e8","description":"Suivi familial en convoi","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231a73e8%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22>🚗</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;background:#000}
  #map{position:absolute;top:0;bottom:0;width:100%}
  .topbar{position:absolute;top:10px;left:10px;right:10px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;font-weight:600;display:flex;align-items:center}
  .chip button{border:none;background:#1a73e8;color:#fff;border-radius:14px;padding:5px 10px;font-size:12px;margin-left:6px;cursor:pointer;font-weight:600}
  .chip.driver-btn{background:#ff9800;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
  .panel{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 4px 20px rgba(0,0,0,.2);width:min(92%,380px);z-index:10;max-height:40vh;overflow-y:auto}
  .panel h2{font-size:15px;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
  .row:last-child{border-bottom:none}
  .row .d{color:#555;font-weight:600}
  .old{opacity:.5}
  .marker{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:bold;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
  .marker.me{border:3px solid #ffeb3b;box-shadow:0 0 0 3px #1a73e8,0 2px 8px rgba(0,0,0,.4)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:16px;padding:26px;width:min(100%,360px)}
  .card h1{font-size:22px;margin-bottom:14px}
  .card label{font-size:13px;font-weight:600;color:#444;display:block;margin:10px 0 4px}
  .card input{width:100%;padding:11px;border:2px solid #ddd;border-radius:10px;font-size:15px}
  .card button{width:100%;margin-top:16px;padding:13px;background:#1a73e8;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
  .hint{font-size:12px;color:#777;margin-top:12px}
  .hidden{display:none!important}
  .alerts{position:absolute;top:60px;right:10px;z-index:15;display:flex;flex-direction:column;gap:8px;max-width:280px}
  .alert{background:#fff;border-left:5px solid #ff5722;padding:10px 14px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;animation:slideIn .3s}
  .alert.warn{border-color:#ff9800}
  .alert.info{border-color:#2196f3}
  .alert.success{border-color:#4caf50}
  @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  body.driver .topbar,body.driver .panel{display:none}
  .driver-ui{position:fixed;inset:0;background:#111;color:#fff;z-index:20;display:none;flex-direction:column;padding:20px}
  body.driver .driver-ui{display:flex}
  .driver-map{flex:1;border-radius:12px;overflow:hidden;position:relative}
  .driver-info{background:#1a1a1a;border-radius:12px;padding:16px;margin-top:10px}
  .driver-info .big{font-size:44px;font-weight:800;line-height:1}
  .driver-info .sub{font-size:14px;color:#888;margin-top:4px}
  .driver-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .driver-grid div{background:#222;border-radius:8px;padding:10px}
  .driver-grid .v{font-size:20px;font-weight:700}
  .driver-grid .l{font-size:11px;color:#999;text-transform:uppercase}
  .driver-exit{position:absolute;top:15px;right:15px;background:#ff5722;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:700;z-index:5;cursor:pointer}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <span class="chip" id="group-label">—</span>
  <span class="chip"><button id="btn-share">📤 Inviter</button></span>
  <span class="chip"><button id="btn-driver" class="driver-btn">🚗 Conduite</button></span>
  <span class="chip hidden" id="tesla-chip"><button id="btn-tesla">⚡ Tesla</button></span>
  <span class="chip" id="status">📡 démarrage…</span>
</div>

<div class="alerts" id="alerts"></div>

<div class="panel">
  <h2>🚗 Convoi familial</h2>
  <div id="list"><div class="row"><span>Chargement…</span></div></div>
</div>

<div class="driver-ui">
  <div class="driver-map" id="driver-map">
    <button class="driver-exit" id="btn-exit-driver">✕ Quitter</button>
  </div>
  <div class="driver-info">
    <div class="big" id="d-next-dist">— km</div>
    <div class="sub" id="d-next-name">véhicule le plus proche</div>
    <div class="driver-grid">
      <div><div class="v" id="d-my-speed">—</div><div class="l">Ma vitesse</div></div>
      <div><div class="v" id="d-my-bat">—</div><div class="l">🔋 Téléphone</div></div>
      <div><div class="v" id="d-count">0</div><div class="l">Véhicules</div></div>
      <div><div class="v" id="d-eta">—</div><div class="l">MAJ</div></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h1>🚗 Family Convoy</h1>
    <label>Ton nom (ou de la voiture)</label>
    <input id="inp-name" placeholder="Ex : Papa, Maman, Voiture 2…">
    <label>Code du groupe</label>
    <input id="inp-group" placeholder="Ex : NOEL2026">
    <button id="btn-join">Rejoindre le convoi</button>
    <p class="hint">📌 Tous les membres doivent utiliser le MÊME code. La position reste privée : seul le groupe la voit.</p>
  </div>
</div>

<script type="module">
// ============================================================
// CONFIG
// ============================================================
const MAPTILER_KEY      = 'nJnYbbeBVl4T09PtkVVv';
const MAPTILER_STYLE_ID = '01a140ea-aca7-765a-b3b1-df5d0b2d41a4';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBLikY235Wr8capctDYiMEnt6AZflbShfs",
  authDomain: "family-convoy-c1b34.firebaseapp.com",
  databaseURL: "https://family-convoy-c1b34-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "family-convoy-c1b34",
  storageBucket: "family-convoy-c1b34.firebasestorage.app",
  messagingSenderId: "378869564440",
  appId: "1:378869564440:web:2c286789be6e783c99af6d"
};

const TESLA_WORKER_URL = ""; // ex: https://tesla-convoy.xxx.workers.dev

// ============================================================
// État global
// ============================================================
const $ = s => document.querySelector(s);
const deviceId = localStorage.getItem('fc_id') || (localStorage.setItem('fc_id', crypto.randomUUID()), localStorage.getItem('fc_id'));
const me = { id: deviceId, name:'', group:'', lat:null, lng:null, speed:0, battery:null, lastMoved:Date.now() };
let members = {};
let teslaCars = {};
const markersMain = {};    // marqueurs carte principale
const markersDriver = {};  // marqueurs carte mode conduite
const trails = {};
const alertState = {};
let boundsDone = false;
let phoneBattery = null;
let driverMap = null;
let driverMode = false;
let followMe = true;

const PALETTE = ['#e53935','#8e24aa','#3949ab','#00897b','#f4511e','#6d4c41','#d81b60','#1e88e5'];
const colorFor = id => PALETTE[[...id].reduce((a,c)=>a+c.charCodeAt(0),0) % PALETTE.length];

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const ago = ts => { const s=Math.round((Date.now()-ts)/1000); return s<60?`${s}s`:`${Math.round(s/60)}min`; };

// ============================================================
// 🔔 Alertes
// ============================================================
function pushAlert(msg, type='warn', ttl=6000){
  const el = document.createElement('div');
  el.className = 'alert ' + type;
  el.textContent = msg;
  $('#alerts').prepend(el);
  if (navigator.vibrate) navigator.vibrate(type==='warn'?[200,100,200]:[100]);
  setTimeout(()=>el.remove(), ttl);
}

// ============================================================
// 🗺️ Carte principale
// ============================================================
const map = new maplibregl.Map({
  container:'map',
  style:`https://api.maptiler.com/maps/${MAPTILER_STYLE_ID}/style.json?key=${MAPTILER_KEY}`,
  center:[2.35,48.85], zoom:5
});
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.on('load', () => {
  map.addSource('trails', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
  map.addLayer({
    id:'trail-lines', type:'line', source:'trails',
    paint:{ 'line-width':3, 'line-opacity':0.7, 'line-color':['get','color'] }
  });
});

// ============================================================
// Firebase
// ============================================================
let db = null, myRef = null;
const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
const rtdb = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
db = rtdb.getDatabase(initializeApp(FIREBASE_CONFIG));

// ============================================================
// 📍 GPS
// ============================================================
function startGPS(){
  if (!navigator.geolocation){ $('#status').textContent='❌ GPS non supporté'; return; }
  navigator.geolocation.watchPosition(p => {
    const newLat=p.coords.latitude, newLng=p.coords.longitude;
    if (me.lat!=null && haversineKm(me.lat,me.lng,newLat,newLng)*1000 > 15) me.lastMoved = Date.now();
    me.lat = newLat; me.lng = newLng;
    me.speed = Math.round((p.coords.speed||0)*3.6);
    $('#status').textContent = `📍 GPS (±${Math.round(p.coords.accuracy)}m, ${me.speed}km/h)`;
  }, e => { $('#status').textContent = '📍 GPS refusé'; pushAlert('⚠️ Autorise la géolocalisation','warn'); },
  { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

if (navigator.getBattery) navigator.getBattery().then(b => {
  phoneBattery = Math.round(b.level*100);
  b.addEventListener('levelchange', ()=> phoneBattery = Math.round(b.level*100));
});

// ============================================================
// 🔋 Wake Lock : garder l'écran allumé
// ============================================================
let wakeLock = null;
async function keepScreenOn(){
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => console.log('Wake Lock relâché'));
  } catch(e){ console.warn('Wake Lock non supporté'); }
}
document.addEventListener('visibilitychange', () => {
  if (wakeLock !== null && document.visibilityState === 'visible') keepScreenOn();
});

// ============================================================
// 📡 Partage + écoute temps réel
// ============================================================
function startSharing(){
  myRef = rtdb.ref(db, `convoy/${me.group}/members/${me.id}`);
  rtdb.onDisconnect(myRef).remove();
  rtdb.onValue(rtdb.ref(db, `convoy/${me.group}/members`), snap => {
    members = snap.val() || {};
    detectAlerts();
    render();
  });
  setInterval(() => {
    if (me.lat == null) return;
    rtdb.set(myRef, {
      name:me.name, lat:me.lat, lng:me.lng,
      speed:me.speed, battery:phoneBattery,
      color:colorFor(me.id), updatedAt:Date.now()
    });
  }, 5000);
}

// ============================================================
// 🚨 Détection d'événements
// ============================================================
function detectAlerts(){
  const myEntry = members[me.id];
  for (const [id, v] of Object.entries(members)) {
    if (!v.updatedAt || v.lat == null) continue;
    const fresh = Date.now() - v.updatedAt < 120000;

    // Véhicule arrêté depuis +30s
    if (id !== me.id && fresh) {
      const stopped = (v.speed||0) < 5;
      const k = 'stop_'+id;
      if (stopped && !alertState[k]) alertState[k]=Date.now();
      else if (stopped && alertState[k] && Date.now()-alertState[k] > 30000 && !alertState[k+'_fired']) {
        alertState[k+'_fired']=true;
        pushAlert(`🛑 ${v.name} est arrêté(e)`,'warn');
      }
      else if (!stopped) { alertState[k]=null; alertState[k+'_fired']=false; }
    }

    // Batterie faible
    if (v.battery != null && v.battery < 20) {
      const k = 'bat_'+id;
      if (!alertState[k]) { alertState[k]=true; pushAlert(`🔋 Batterie faible : ${v.name} (${v.battery}%)`,'warn'); }
    }

    // Véhicule qui s'éloigne
    if (id !== me.id && fresh && myEntry) {
      const dist = haversineKm(myEntry.lat, myEntry.lng, v.lat, v.lng);
      const k = 'far_'+id;
      if (dist > 20 && !alertState[k]) { alertState[k]=true; pushAlert(`↔️ ${v.name} est loin (${dist.toFixed(0)} km)`,'info'); }
      else if (dist < 15) alertState[k]=false;
    }

    // Signal perdu
    if (!fresh) {
      const k = 'stale_'+id;
      if (!alertState[k]) { alertState[k]=true; pushAlert(`📵 ${v.name} : pas de signal depuis ${ago(v.updatedAt)}`,'warn',8000); }
    } else alertState['stale_'+id]=false;
  }
}

// ============================================================
// ⚡ Tesla (si Worker configuré)
// ============================================================
if (TESLA_WORKER_URL) {
  $('#tesla-chip').classList.remove('hidden');
  $('#btn-tesla').onclick = () => window.open(TESLA_WORKER_URL + '/auth', '_blank');
  const loadTesla = async () => {
    try {
      const cars = await (await fetch(TESLA_WORKER_URL + '/vehicles')).json();
      if (cars.error) return;
      teslaCars = {};
      for (const c of cars) {
        const d = await (await fetch(`${TESLA_WORKER_URL}/data?id=${c.id}`)).json();
        if (!d.error) teslaCars['tesla_'+c.id] = {...d, name:'⚡ '+d.name, color:'#7b1fa2'};
      }
      render();
    } catch(e){}
  };
  loadTesla(); setInterval(loadTesla, 60000);
}

// ============================================================
// 🎯 Fabrique un élément marqueur
// ============================================================
function makeMarkerEl(id, v){
  const el = document.createElement('div');
  el.className = 'marker' + (id===me.id?' me':'');
  el.style.background = v.color || '#7b1fa2';
  el.textContent = (v.name||'?').replace(/[^\wà-ÿ]/gi,'').charAt(0).toUpperCase() || '🚗';
  return el;
}

// ============================================================
// 🎨 Rendu (carte principale + carte conduite)
// ============================================================
function render(){
  const all = {...members, ...teslaCars};

  // --- Marqueurs : carte principale ---
  for (const [id, v] of Object.entries(all)) {
    if (v.lat == null) continue;
    if (!markersMain[id]) {
      markersMain[id] = new maplibregl.Marker({element: makeMarkerEl(id, v)})
        .setLngLat([v.lng, v.lat]).addTo(map);
    } else {
      markersMain[id].setLngLat([v.lng, v.lat]);
    }
    markersMain[id].setPopup(new maplibregl.Popup({offset:25}).setHTML(
      `<b>${v.name}</b><br>${v.speed?`🚀 ${v.speed} km/h<br>`:''}${v.battery!=null?`🔋 ${v.battery}%<br>`:''}il y a ${ago(v.updatedAt||Date.now())}`));
  }

  // --- Marqueurs : carte mode conduite ---
  if (driverMap) {
    for (const [id, v] of Object.entries(all)) {
      if (v.lat == null) continue;
      if (!markersDriver[id]) {
        markersDriver[id] = new maplibregl.Marker({element: makeMarkerEl(id, v)})
          .setLngLat([v.lng, v.lat]).addTo(driverMap);
      } else {
        markersDriver[id].setLngLat([v.lng, v.lat]);
      }
    }
  }

  // --- Nettoyage : séparé pour chaque carte (PLUS DE BUG) ---
  for (const id of Object.keys(markersMain)) if (!all[id] || all[id].lat==null){ markersMain[id].remove(); delete markersMain[id]; }
  for (const id of Object.keys(markersDriver)) if (!all[id] || all[id].lat==null){ markersDriver[id].remove(); delete markersDriver[id]; }

  // --- Traînées ---
  for (const [id, v] of Object.entries(all)) {
    if (v.lat == null) continue;
    if (!trails[id]) trails[id] = [];
    const last = trails[id][trails[id].length-1];
    if (!last || haversineKm(last[1],last[0],v.lat,v.lng)*1000 > 30) {
      trails[id].push([v.lng, v.lat]);
      if (trails[id].length > 80) trails[id].shift();
    }
  }
  const trailFC = {
    type:'FeatureCollection',
    features: Object.entries(trails).map(([id,pts]) => ({
      type:'Feature',
      properties:{ color: all[id]?.color || '#888' },
      geometry:{ type:'LineString', coordinates: pts }
    }))
  };
  if (map.getSource('trails')) map.getSource('trails').setData(trailFC);
  if (driverMap && driverMap.getSource('trails-d')) driverMap.getSource('trails-d').setData(trailFC);

  // --- Cadrage initial ---
  if (!boundsDone && Object.keys(all).length){
    const b = new maplibregl.LngLatBounds();
    Object.values(all).forEach(v => v.lat!=null && b.extend([v.lng, v.lat]));
    map.fitBounds(b, {padding:60, maxZoom:12}); boundsDone = true;
  }

  // --- Suivi automatique en mode conduite ---
  if (driverMode && followMe && me.lat!=null && driverMap) {
    driverMap.easeTo({ center:[me.lng, me.lat], zoom:15, duration:1500 });
  }

  // --- Panneau liste ---
  const myEntry = all[me.id] || (me.lat!=null ? {lat:me.lat,lng:me.lng} : null);
  let html = '';
  const sorted = Object.entries(all).sort((a,b)=>{
    if (a[0]===me.id) return -1; if (b[0]===me.id) return 1;
    const da = myEntry ? haversineKm(myEntry.lat,myEntry.lng,a[1].lat,a[1].lng) : 0;
    const db2 = myEntry ? haversineKm(myEntry.lat,myEntry.lng,b[1].lat,b[1].lng) : 0;
    return da-db2;
  });
  for (const [id, v] of sorted) {
    const stale = v.updatedAt && Date.now()-v.updatedAt > 120000;
    const dist = myEntry && id!==me.id ? `${haversineKm(myEntry.lat,myEntry.lng,v.lat,v.lng).toFixed(1)} km` : (id===me.id?'(toi)':'');
    html += `<div class="row ${stale?'old':''}">
      <span>${v.name||id} ${v.battery!=null?`🔋${v.battery}%`:''} ${stale?'⚠️':''}</span>
      <span class="d">${dist} ${v.updatedAt?`· ${ago(v.updatedAt)}`:''}</span></div>`;
  }
  $('#list').innerHTML = html || '<div class="row"><span>Personne…</span></div>';

  if (driverMode) updateDriverUI(all, myEntry);
}

// ============================================================
// 🚗 Mode conducteur
// ============================================================
function enterDriverMode(){
  driverMode = true;
  document.body.classList.add('driver');
  if (!driverMap) {
    driverMap = new maplibregl.Map({
      container:'driver-map',
      style:`https://api.maptiler.com/maps/${MAPTILER_STYLE_ID}/style.json?key=${MAPTILER_KEY}`,
      center:[me.lng||2.35, me.lat||48.85],
      zoom:15, pitch:45
    });
    driverMap.addControl(new maplibregl.NavigationControl(),'top-left');
    driverMap.on('dragstart', ()=> followMe=false);
    driverMap.on('load', () => {
      driverMap.addSource('trails-d', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
      driverMap.addLayer({
        id:'trail-lines-d', type:'line', source:'trails-d',
        paint:{ 'line-width':3, 'line-opacity':0.7, 'line-color':['get','color'] }
      });
      render();
    });
  } else {
    setTimeout(()=> driverMap.resize(), 50);
  }
  setTimeout(render, 150);
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
}
function exitDriverMode(){
  driverMode = false;
  document.body.classList.remove('driver');
  if (screen.orientation?.unlock) screen.orientation.unlock();
}
function updateDriverUI(all, myEntry){
  if (!myEntry) return;
  let nearest=null, minD=Infinity;
  for (const [id,v] of Object.entries(all)) {
    if (id===me.id || v.lat==null) continue;
    const d = haversineKm(myEntry.lat, myEntry.lng, v.lat, v.lng);
    if (d<minD){ minD=d; nearest=v; }
  }
  $('#d-next-dist').textContent = nearest ? `${minD.toFixed(1)} km` : '— km';
  $('#d-next-name').textContent = nearest ? `👉 ${nearest.name}` : 'tu es seul';
  $('#d-my-speed').textContent = `${me.speed||0} km/h`;
  $('#d-my-bat').textContent = phoneBattery!=null ? `${phoneBattery}%` : '—';
  $('#d-count').textContent = Object.keys(all).length;
  $('#d-eta').textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
$('#btn-driver').onclick = enterDriverMode;
$('#btn-exit-driver').onclick = exitDriverMode;

// ============================================================
// 📲 PWA Service Worker (offline)
// ============================================================
const SW_CODE = `
const CACHE = 'fc-v3';
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    caches.open(CACHE).then(c =>
      c.match(e.request).then(r => r || fetch(e.request).then(res => {
        if (res.ok && e.request.url.startsWith('http')) c.put(e.request, res.clone());
        return res;
      }).catch(()=>r))
    )
  );
});`;
if ('serviceWorker' in navigator) {
  const blob = new Blob([SW_CODE], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ============================================================
// 🔐 Rejoindre / Inviter
// ============================================================
function join(){
  me.name = $('#inp-name').value.trim() || 'Voiture';
  me.group = ($('#inp-group').value.trim() || 'FAMILLE').toUpperCase();
  localStorage.setItem('fc_name', me.name);
  localStorage.setItem('fc_group', me.group);
  $('#overlay').classList.add('hidden');
  $('#group-label').textContent = '👥 ' + me.group;
  startGPS();
  startSharing();
  keepScreenOn();
  pushAlert(`✅ Rejoint le convoi ${me.group}`, 'success');
}
$('#btn-join').onclick = join;
$('#btn-share').onclick = () => {
  const link = `${location.origin}${location.pathname}?g=${me.group}`;
  navigator.clipboard.writeText(link).then(()=> pushAlert('Lien copié ! 📋','info'));
};

// Auto-rejoint si déjà enregistré ou lien partagé
const params = new URLSearchParams(location.search);
if (params.get('g')) me.group = params.get('g').toUpperCase();
const storedName = localStorage.getItem('fc_name');
const storedGroup = localStorage.getItem('fc_group');
if (storedName && storedGroup) {
  me.name = storedName; me.group = storedGroup;
  $('#inp-name').value = me.name; $('#inp-group').value = me.group;
  join();
} else {
  $('#overlay').classList.remove('hidden');
  if (params.get('g')) $('#inp-group').value = params.get('g').toUpperCase();
}
</script>
